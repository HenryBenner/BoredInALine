name: Bootstrap project files

on:
  push:
    paths:
      - '.bootstrap/project.zip.b64'

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore project archive
        shell: bash
        run: |
          base64 --decode .bootstrap/project.zip.b64 > /tmp/project.zip
          unzip -o /tmp/project.zip -d .
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap-project.yml

      - name: Commit project files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Add BoredInALine application source"
          git push
