name: Bootstrap project files

on:
  push:
    paths:
      - '.bootstrap/ready'

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore project archive
        shell: bash
        run: |
          cat .bootstrap/lite-* > /tmp/project.tar.xz.b64
          base64 --decode /tmp/project.tar.xz.b64 > /tmp/project.tar.xz
          tar -xJf /tmp/project.tar.xz -C .
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap-project.yml

      - name: Regenerate dependency lock files
        shell: bash
        run: |
          npm install --package-lock-only --ignore-scripts --legacy-peer-deps || true
          (cd server && npm install --package-lock-only --ignore-scripts --legacy-peer-deps) || true

      - name: Commit project files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Add BoredInALine application source"
          git push
